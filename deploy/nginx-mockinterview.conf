# nginx in front of the app: HTTPS + long timeouts for PDF batches.
# Install: sudo cp deploy/nginx-mockinterview.conf /etc/nginx/sites-available/mockinterview
#          sudo ln -s /etc/nginx/sites-available/mockinterview /etc/nginx/sites-enabled/
#          replace interview.example.com below, then: sudo nginx -t && sudo systemctl reload nginx
# HTTPS certificate (if 中台 does not provide one): sudo certbot --nginx -d interview.example.com

server {
    listen 80;
    server_name interview.example.com;

    # Class roster uploads (Excel/CSV exports)
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # "Archive session" renders 2 PDFs per student in one request
        # (about 1-2 s each); the 60 s default cuts it off for a full session.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
